name: Build

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/matrix.sh'
      - '.github/workflows/build.yml'

env:
  MIN_GDAL: "3.6"
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: discover
        run: |
          MATRIX=$(MIN_GDAL="${MIN_GDAL}" ./scripts/matrix.sh)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          MM=$(echo "${{ matrix.gdal_version }}" | cut -d. -f1,2)
          {
            echo "list<<TAGEOF"
            echo "${IMAGE}:ubuntu-full-${{ matrix.gdal_version }}"
            echo "${IMAGE}:ubuntu-full-${MM}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          build-args: |
            BASE_IMAGE=ghcr.io/osgeo/gdal:ubuntu-full-${{ matrix.gdal_version }}
          load: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.gdal_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gdal_version }}

      - name: Smoke test
        run: |
          docker run --rm "${IMAGE}:ubuntu-full-${{ matrix.gdal_version }}" bash -c '
            python3 -c "from osgeo import ogr; assert ogr.GetDriverByName(\"MSSQLSpatial\")" &&
            odbcinst -q -d -n "ODBC Driver 18 for SQL Server"
          '

      - name: Push
        run: |
          while IFS= read -r t; do
            [ -n "$t" ] && docker push "$t"
          done <<< "${{ steps.tags.outputs.list }}"

  update-latest:
    needs: build
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point ubuntu-full-latest/latest at the newest version that actually built
        run: |
          # Not every matrix entry necessarily builds (e.g. upstream not
          # signing a repo for a given Ubuntu release yet) so "latest" is
          # derived from what's actually in our own registry, not from
          # upstream's newest version.
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull&service=ghcr.io" | jq -r .token)
          NEWEST=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${{ github.repository }}/tags/list?n=1000" \
            | jq -r '.tags[] | select(test("^ubuntu-full-[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^ubuntu-full-"; "")' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$NEWEST" ]; then
            echo "No ubuntu-full-X.Y.Z tags found in ${IMAGE} yet, nothing to alias" >&2
            exit 1
          fi
          echo "Newest successfully published version: $NEWEST"
          docker buildx imagetools create "${IMAGE}:ubuntu-full-${NEWEST}" --tag "${IMAGE}:ubuntu-full-latest"
          docker buildx imagetools create "${IMAGE}:ubuntu-full-${NEWEST}" --tag "${IMAGE}:latest"
